name: Apply non-character MCP schema patch

on:
  push:
    branches:
      - feat/non-character-grand-design-generation
    paths:
      - .github/workflows/apply-non-character-mcp-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/non-character-grand-design-generation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch MCP schema fail-closed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/mcp/server.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'Proceed to an image model only after that exact request returns a successful Generation Package with non-empty style_lock and subject_lock. If preparation returns a Canon validation error, do not reconstruct or guess character facts from memory, conversation history, legacy assets, or prior candidates.',
                  'Proceed to an image model only after that exact request returns a successful Generation Package with non-empty style_lock. Character requests must also have non-empty subject_lock and Approved Anchor references. Subjectless non-character requests are allowed only when Grand Design explicitly defines the asset type and scene_context.reference_paths resolves to repository source assets; their subject_lock is intentionally empty and reference_assets must contain source_asset entries. If preparation returns a Canon validation error, do not reconstruct or guess facts from memory, conversation history, legacy assets, or prior candidates.'
              ),
              (
                  "'Return a fail-closed Generation Package from the MCP-independent Visual Director Core. An explicit scene_context.repository_path is sufficient for local requests; hosted read-only requests ignore client-local repository paths and resolve the project from the configured repository catalog.',",
                  "'Return a fail-closed Generation Package from the MCP-independent Visual Director Core. Character requests use subject_ids and Approved Anchors. Grand-Design non-character requests may use subject_ids: [] only when scene_context.reference_paths supplies repository-relative source assets. An explicit scene_context.repository_path is sufficient for local requests; hosted read-only requests ignore client-local repository paths and resolve the project from the configured repository catalog.',"
              ),
              (
                  'project_id: z.string().min(1), asset_type: z.string().min(1), subject_ids: z.array(z.string().min(1)).min(1), request_text: z.string().min(1), scene_context: z.record(z.string(), z.unknown()).optional(),',
                  'project_id: z.string().min(1), asset_type: z.string().min(1), subject_ids: z.array(z.string().min(1)), request_text: z.string().min(1), scene_context: z.record(z.string(), z.unknown()).optional(),'
              ),
              (
                  'grand_design_lock: z.string().optional(),\n          style_lock: z.string(),',
                  'grand_design_lock: z.string().optional(),\n          grand_design_contract: z.unknown().optional(),\n          style_lock: z.string(),'
              ),
              (
                  "role: z.enum(['global_reference', 'subject_anchor'])",
                  "role: z.enum(['global_reference', 'subject_anchor', 'source_asset'])"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one MCP schema match, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit MCP schema patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mcp/server.ts
          git diff --cached --check
          git commit -m "feat: expose subjectless grand design preparation over MCP"
          git push origin HEAD:feat/non-character-grand-design-generation
