name: Deploy diagnostic UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build static diagnostic site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R pages/. _site/
          short_sha="${GITHUB_SHA::7}"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i "s/__BUILD_REVISION__/${short_sha}/g" _site/index.html
          sed -i "s/__BUILD_TIME__/${build_time}/g" _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
