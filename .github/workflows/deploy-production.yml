name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_DVFM365SzDMxINnnp2gvKmVK
  VERCEL_PROJECT_ID: prj_n4V9TIgACzHhy1t0pn4e06P7H9n5
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  PRODUCTION_URL: https://visual-director-beta.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::GitHub Actions secret VERCEL_TOKEN is not configured or is not available to this workflow. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "VERCEL_TOKEN is configured."

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Capture deployment metadata
        shell: bash
        run: |
          echo "VISUAL_DIRECTOR_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "VISUAL_DIRECTOR_BUILD_REF=main" >> "$GITHUB_ENV"
          echo "VISUAL_DIRECTOR_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: npm run check && npm run build

      - name: Pull Vercel production configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        id: deploy
        shell: bash
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --env VISUAL_DIRECTOR_BUILD_SHA="$VISUAL_DIRECTOR_BUILD_SHA" \
            --env VISUAL_DIRECTOR_BUILD_REF="$VISUAL_DIRECTOR_BUILD_REF" \
            --env VISUAL_DIRECTOR_BUILD_TIME="$VISUAL_DIRECTOR_BUILD_TIME")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url"

      - name: Verify Hosted MCP
        env:
          VISUAL_DIRECTOR_MCP_URL: ${{ env.PRODUCTION_URL }}/mcp
        run: npm run verify:hosted

      - name: Verify Review Deployment
        env:
          VISUAL_DIRECTOR_REVIEW_URL: ${{ env.PRODUCTION_URL }}
        run: EXPECTED_REVISION="$VISUAL_DIRECTOR_BUILD_SHA" npm run verify:review

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Visual Director Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main commit: \`$VISUAL_DIRECTOR_BUILD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$VISUAL_DIRECTOR_BUILD_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build time: \`$VISUAL_DIRECTOR_BUILD_TIME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: ${{ env.PRODUCTION_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hosted MCP verification: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI review smoke verification: passed" >> "$GITHUB_STEP_SUMMARY"
