name: Issue 82 migrate test imports

on:
  push:
    branches:
      - feat/issue-82-mcp-2026-07-28

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/issue-82-mcp-2026-07-28
      - name: Rewrite v1 test imports
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'test/adopt-anchor.test.ts': [
                  ("import { Client } from '@modelcontextprotocol/sdk/client/index.js';\nimport { InMemoryTransport } from '@modelcontextprotocol/sdk/inMemory.js';",
                   "import { Client, InMemoryTransport } from '@modelcontextprotocol/client';"),
              ],
              'test/repository-path-bootstrap.test.ts': [
                  ("import { Client } from '@modelcontextprotocol/sdk/client/index.js';\nimport { InMemoryTransport } from '@modelcontextprotocol/sdk/inMemory.js';\nimport { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';",
                   "import { Client, InMemoryTransport, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';"),
              ],
              'test/visual-director.test.ts': [
                  ("import { Client } from '@modelcontextprotocol/sdk/client/index.js';\nimport { InMemoryTransport } from '@modelcontextprotocol/sdk/inMemory.js';\nimport { StreamableHTTPClientTransport } from '@modelcontextprotocol/sdk/client/streamableHttp.js';",
                   "import { Client, InMemoryTransport, StreamableHTTPClientTransport } from '@modelcontextprotocol/client';"),
              ],
              'test/hosted-server.test.ts': [
                  ("async function connectClient(versionNegotiation: ConstructorParameters<typeof Client>[1]['versionNegotiation']) {",
                   "async function connectClient(versionNegotiation: { mode: 'legacy' } | { mode: { pin: '2026-07-28' } }) {"),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {file_name}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
      - name: Commit migrated tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test
          git commit -m "test: migrate remaining MCP imports to v2"
          git push
